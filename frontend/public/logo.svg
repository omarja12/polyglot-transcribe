<svg xmlns="http://www.w3.org/2000/svg" width="200" height="48" viewBox="0 0 200 48" fill="none">
  <defs>
    <linearGradient id="lg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0EA5A4"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Mark: stylized waveform + speech bubble -->
  <g transform="translate(8,6)">
    <rect x="0" y="0" width="40" height="36" rx="8" fill="#0b1020" opacity="0.04"/>
    <path d="M6 18c1.5 0 2.5-6 4-6s2.5 6 4 6 2.5-6 4-6 2.5 6 4 6 2.5-6 4-6 2.5 6 4 6" stroke="url(#lg)" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <!-- subtle speech tail -->
    <path d="M36 30 L30 28 L30 34 Z" fill="url(#lg)" opacity="0.95"/>
  </g>

  <!-- Wordmark: clean, professional -->
  <text x="64" y="22" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial" font-size="18" font-weight="700" fill="#0b1020">Polyglot</text>
  <text x="64" y="40" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial" font-size="12" font-weight="600" fill="#475569">Transcribe</text>
</svg>